version: "3.9"

services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./data:/app/data

  worker:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    command:
      - sh
      - -lc
      - celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-1}
    volumes:
      - ./apps/api/app:/app/app
      - ./data:/app/data

  web:
    build:
      context: ./apps/web
    env_file:
      - ./apps/web/.env.local
    ports:
      - "${WEB_PORT}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
